<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hello Machine — composition B</title>
    <style>
      :root {
        --ink: #101010;
        --paper: #fbfbf8;
        --blue: #2358ff;
        --orange: #ff5a1f;
        --lime: #c8ff4d;
        --red: #d93a22;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 5rem 1fr 1fr;
        grid-template-rows: auto 1fr auto;
        gap: 2rem;
        padding: 2rem;
      }
      nav {
        grid-row: 1/-1;
        border-right: 1px solid #aaa;
        font: 12px monospace;
        writing-mode: vertical-rl;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        padding-right: 1rem;
      }
      header {
        grid-column: 2/-1;
        display: flex;
        justify-content: space-between;
        font: 12px monospace;
        text-transform: uppercase;
      }
      h1 {
        grid-column: 2/-1;
        align-self: center;
        max-width: 10ch;
        font-size: clamp(4rem, 12vw, 12rem);
        line-height: 0.78;
        letter-spacing: -0.08em;
        margin: 0;
      }
      h1 span {
        font-family: Georgia, serif;
        font-style: italic;
        color: var(--red);
      }
      .note {
        grid-column: 2;
        padding: 1.5rem;
        border-top: 2px solid var(--ink);
        font-size: 1.2rem;
        max-width: 28rem;
      }
      .stamp {
        grid-column: 3;
        align-self: end;
        justify-self: end;
        width: min(22rem, 80%);
        aspect-ratio: 1;
        background: var(--blue);
        color: var(--paper);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transform: rotate(-5deg);
      }
      .stamp b {
        font-size: clamp(3rem, 7vw, 7rem);
        line-height: 0.8;
        letter-spacing: -0.08em;
      }
      .stamp i {
        width: 4rem;
        height: 4rem;
        background: var(--lime);
        transform: rotate(45deg);
        align-self: end;
      }
      @media (max-width: 650px) {
        main {
          grid-template-columns: 3rem 1fr;
          grid-template-rows: auto auto 1fr auto;
          gap: 1.5rem;
          padding: 1rem;
        }
        .stamp {
          grid-column: 2;
          width: 70%;
          margin-top: 2rem;
        }
        .note {
          grid-column: 2;
        }
        header {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav><span>HM / study B</span><span>expert-led / AI-accelerated</span></nav>
      <header><b>Hello Machine</b><span>composition study / 2026</span></header>
      <h1>Make <span>clear</span> work.</h1>
      <p class="note">
        A vertical editorial route: first the proposition, then a single proof artifact. The
        production homepage chooses a more interactive sequence.
      </p>
      <div class="stamp">
        <small>brief → live</small><b>people<br />+ machine</b><i></i>
      </div>
    </main>
  </body>
</html>
